
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up | Chushpany</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-shell">

  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="brand-mark">C</span>
      <span>CHUSHPANY<span class="brand-accent">.</span></span>
    </a>

    <button class="menu-toggle" aria-label="Open menu">☰</button>

    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="team.html">Team</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html">Contact</a>
      <a class="nav-login" href="login.html">Log in</a>
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle light and dark mode">☼</button>
    </nav>
  </header>

  <main>
    <section class="auth-wrap section">
      <div class="auth-card">
        <p class="eyebrow">Member space</p>
        <h1>Make room<br><span class="gradient-text">for ideas.</span></h1>
        <p>Create a local demo account to test the profile flow.</p>

        <form id="signup-form" novalidate>

          <div class="form-row">
            <label for="signup-name">Name</label>
            <input id="signup-name" name="name" type="text" placeholder="Your name">
            <small class="field-error" data-error-for="name"></small>
          </div>

          <div class="form-row">
            <label for="signup-email">Email</label>
            <input id="signup-email" name="email" type="text" placeholder="you@example.com">
            <small class="field-error" data-error-for="email"></small>
          </div>

          <div class="form-row">
            <label for="signup-phone">Phone</label>
            <input id="signup-phone" name="phone" type="text" placeholder="+7 700 000 00 00">
            <small class="field-error" data-error-for="phone"></small>
          </div>

          <div class="form-row">
            <label for="signup-password">Password</label>
            <input id="signup-password" name="password" type="password" placeholder="8+ chars, letter + number">
            <small class="field-error" data-error-for="password"></small>
          </div>

          <button class="button button-primary" type="submit">
            Create account <span>↗</span>
          </button>

          <p class="form-status" id="signup-status" aria-live="polite"></p>

        </form>

        <p class="auth-switch">
          Already registered? <a href="login.html">Log in</a>
        </p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <a class="brand" href="index.html">
      <span class="brand-mark">C</span>
      <span>CHUSHPANY<span class="brand-accent">.</span></span>
    </a>
    <a href="contact.html">Contact us ↗</a>
  </footer>

</div>

<script src="js/script.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
